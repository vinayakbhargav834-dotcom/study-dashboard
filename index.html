<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/subjects.css">
    <link rel="stylesheet" href="css/todo.css">
    <link rel="stylesheet" href="css/timer.css">
    <link rel="stylesheet" href="css/exams.css">
    <title>Study Dashboard</title>
</head>
<body>
    <div class="container">
        <h1>📚 My Study Dashboard</h1>
        <p class="subtitle">
            Plan your study. Track your progress. Keep improving.
        </p>
        <!-- STATS -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-icon">📚</div>
                <div>
                    <h3 id="subjectCount">0</h3>
                    <p>Subjects</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div>
                    <h3 id="completedCount">0</h3>
                    <p>Completed</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📝</div>
                <div>
                    <h3 id="taskCount">0</h3>
                    <p>Tasks</p>
                </div>
            </div>
        </div>
        <!-- SUBJECTS -->
        <section class="card">
            <h2>📖 My Subjects</h2>
            <div
                class="subjects"
                id="subjectsContainer">
            </div>
            <button onclick="addSubject()">
                ➕ Add Subject
            </button>
            <div class="progress-box">
                <p>
                    Overall Progress:
                    <span id="progressText">0%</span>
                </p>
                <div class="progress-bar">
                    <div id="progressFill"></div>
                </div>
            </div>
            <p id="studyGoal">
                Complete all your subjects 📚
            </p>
            <button
                id="resetButton"
                onclick="resetProgress()">
                🔄 Reset Progress
            </button>
        </section>
        <!-- TO-DO LIST -->
        <section class="card">
            <h2>📝 To-Do List</h2>
            <div class="todo-input">
                <input
                    id="todoInput"
                    type="text"
                    placeholder="Enter a task">
                <button onclick="addTodo()">
                    ➕ Add
                </button>
            </div>
            <ul id="todoList"></ul>
        </section>
        <!-- STUDY TIMER -->
        <section class="card">
            <h2>⏱️ Study Timer</h2>
            <div id="timer">
                25:00
            </div>
            <div class="timer-buttons">
                <button onclick="startTimer()">
                    ▶️ Start
                </button>
                <button onclick="pauseTimer()">
                    ⏸️ Pause
                </button>
                <button onclick="resetTimer()">
                    🔄 Reset
                </button>
            </div>
        </section>
        <!-- EXAM COUNTDOWN -->
        <section class="card">
            <h2>📅 Exam Countdown</h2>
            <div class="exam-input">
                <input
                    id="examName"
                    type="text"
                    placeholder="Exam name">
                <input
                    id="examDate"
                    type="date">
                <button onclick="addExam()">
                    ➕ Add Exam
                </button>
            </div>
            <div id="examList"></div>
        </section>
    </div>
    <script src="js/data.js"></script>
<script src="js/stats.js"></script>
<script src="js/subjects.js"></script>
<script src="js/todos.js"></script>
<script src="js/timer.js"></script>
<script src="js/exam.js"></script>
<script src="js/app.js"></script>
</body>

</html>
